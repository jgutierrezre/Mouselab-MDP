[tools]
python = "3.11"
node = "20"

[tasks.setup]
description = "Install Python and Node dependencies"
run = "uv sync && npm install"

[tasks.build]
description = "Build the TypeScript plugin bundle"
run = "npm run build"

[tasks.exp]
description = "Generate trials, compile CoffeeScript, and build plugin"
run = "cd experiment && make exp && cd .. && npm run build"

[tasks.watch]
description = "Watch CoffeeScript compilation"
run = "cd experiment && make watch"

[tasks.serve]
description = "Serve the experiment locally"
run = "node server.js"